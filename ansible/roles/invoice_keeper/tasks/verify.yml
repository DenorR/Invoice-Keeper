---
- name: Панель открывается по {{ ik_public_url }}
  ansible.builtin.uri:
    url: "{{ ik_public_url }}/api/v1/openapi.json"
    status_code: 200
    validate_certs: "{{ ik_access_mode == 'https' }}"
    timeout: 10
  register: ik_check
  until: ik_check.status == 200
  retries: 30          # HTTPS-сертификат при первом запуске выдаётся до минуты
  delay: 5
  when: ik_verify_url | bool

- name: Итог
  ansible.builtin.debug:
    msg:
      - "Invoice Keeper {{ ik_version }} — {{ ik_public_url }}"
      - "Swagger: {{ ik_public_url }}/api/v1/docs"
      - "Суперадмин: {{ ik_admin_login }} (пароль — в Vault)"
      - "Telegram: {{ 'чат ' ~ ik_telegram_chat_id if ik_telegram_bot_token else 'не подключён' }}"
      - "Управление на сервере: {{ ik_cli_link | basename }} help"
