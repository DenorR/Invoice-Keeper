# Локальный запуск:  docker compose up -d --build   →  http://localhost:8080
services:
  app:
    build: .
    image: invoice-keeper:latest
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ik-data:/app/data   # SQLite-база переживает перезапуск и пересборку
    restart: unless-stopped

volumes:
  ik-data:
