# Локальный запуск:  docker compose up -d --build   →  http://localhost:8080
services:
  app:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-invoice-keeper}:latest
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ik-data:/app/data   # SQLite-база переживает перезапуск и пересборку
    restart: unless-stopped
    logging:              # журнал контейнера не растёт бесконечно: 5 файлов по 10 МБ
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ik-data:
