# Сервер (VPS) с HTTPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# В .env укажите DOMAIN (например 203.0.113.10.sslip.io) и COOKIE_SECURE=true.
services:
  app:
    ports: !reset []   # наружу приложение не публикуется — только через Caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    volumes:
      - ./deploy:/etc/caddy:ro   # каталог, а не файл: изменения после git pull видны внутри контейнера
      - caddy-data:/data
      - caddy-config:/config

# IPv6 для контейнеров: на части VPS Telegram API доступен только по IPv6
# (так на нашем стенде — по IPv4 api.telegram.org заблокирован).
networks:
  default:
    enable_ipv6: true

volumes:
  caddy-data:
  caddy-config:
