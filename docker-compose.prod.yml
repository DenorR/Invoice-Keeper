# Сервер (VPS) с HTTPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Если Telegram доступен с сервера только по IPv6 — добавьте -f docker-compose.ipv6.yml.
# Установщик из deploy-kit/ делает всё это сам и записывает набор файлов в COMPOSE_FILE в .env.
# В .env укажите DOMAIN (например 203.0.113.10.sslip.io) и COOKIE_SECURE=true.
services:
  app:
    ports: !reset []   # наружу приложение не публикуется — только через Caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    volumes:
      - ./deploy:/etc/caddy:ro   # каталог, а не файл: изменения после git pull видны внутри контейнера
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
