  /api/v1/payment-occurrences:
    get:
      tags:
      - Платежи (периоды)
      summary: Получение списка платежей, оплаченные и просроченные
      operationId: list_occurrences_api_v1_payment_occurrences_get
      security:
      - HTTPBearer: []
      - APIKeyCookie: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - paid
            - unpaid
            type: string
          - type: 'null'
          description: paid / unpaid
          title: Status
        description: paid / unpaid
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: true — только с просрочкой
          title: Overdue
        description: true — только с просрочкой
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          title: Currency
      - name: recurring_payment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Recurring Payment Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок не раньше
          title: From
        description: Срок не раньше
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок не позже
          title: To
        description: Срок не позже
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          description: Включать периоды прекращённых платежей
          default: true
          title: Include Inactive
        description: Включать периоды прекращённых платежей
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Категория; 0 — без категории
          title: Category Id
        description: Категория; 0 — без категории
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          default: due_date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
