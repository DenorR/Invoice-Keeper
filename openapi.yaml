        (UTF-8, percent-encoding), чтобы оно не попадало в журналы запросов. Только
        PDF, PNG, JPG, WebP: тип определяется по содержимому, расширение должно ему
        соответствовать; PDF со скриптами, вложениями и запуском программ отклоняется.
        Размер — не больше UPLOAD_MAX_MB (по умолчанию 10 МБ). Новый файл заменяет
        прежний. Администратор может отключить загрузку в настройках.'
