          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
        currencies:
          items:
            $ref: '#/components/schemas/CurrencySummaryOut'
          type: array
          title: Currencies
      type: object
      required:
      - today
      - date_from
      - date_to
      - currencies
      title: SummaryOut
    TelegramStatus:
      properties:
        bot_configured:
          type: boolean
          title: Bot Configured
        chat_configured:
          type: boolean
          title: Chat Configured
        bot_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Bot Username
          description: Имя бота, если он подключился к Telegram
      type: object
      required:
      - bot_configured
      - chat_configured
      - bot_username
      title: TelegramStatus
    TotalOut:
      properties:
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
          examples:
          - '170000.00'
        count:
          type: integer
          title: Count
      type: object
      required:
      - amount
      - count
      title: TotalOut
    UserCreate:
      properties:
        login:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[A-Za-z0-9_.\-]+$
          title: Login
          examples:
          - ivan
        password:
          type: string
          maxLength: 128
          minLength: 6
          title: Password
          examples:
          - secret123
        name:
          anyOf:
          - type: string
            maxLength: 128
            pattern: ^[^\x00-\x1F\x7F]*$
            examples:
            - Иван Петров
          - type: 'null'
          title: Name
      additionalProperties: false
      type: object
      required:
      - login
      - password
      title: UserCreate
    UserOut:
      properties:
        id:
          type: integer
          title: Id
        login:
          type: string
          title: Login
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        role:
          type: string
          enum:
          - admin
          - user
          title: Role
        managed_by_env:
          type: boolean
          title: Managed By Env
          description: Администратор задаётся в .env и не изменяется через API
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - login
      - name
      - role
      - managed_by_env
      - created_at
      title: UserOut
    UserUpdate:
      properties:
        login:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 3
            pattern: ^[A-Za-z0-9_.\-]+$
            examples:
            - ivan
          - type: 'null'
          title: Login
        password:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 6
            examples:
            - secret123
          - type: 'null'
          title: Password
        name:
          anyOf:
          - type: string
            maxLength: 128
            pattern: ^[^\x00-\x1F\x7F]*$
            examples:
            - Иван Петров
          - type: 'null'
          title: Name
      additionalProperties: false
      type: object
      title: UserUpdate
  securitySchemes:
    HTTPBearer:
      type: http
      description: Токен из ответа POST /api/v1/auth/login
      scheme: bearer
    APIKeyCookie:
      type: apiKey
      description: Сессионная cookie веб-панели
      in: cookie
      name: ik_session
