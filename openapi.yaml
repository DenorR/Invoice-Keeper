components:
  schemas:
    AuditOut:
      properties:
        id:
          type: integer
          title: Id
        at:
          type: string
          format: date-time
          title: At
        actor_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actor User Id
        actor_label:
          type: string
          title: Actor Label
        action:
          type: string
          title: Action
        entity:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity
        entity_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Entity Id
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
      type: object
      required:
      - id
      - at
      - actor_user_id
      - actor_label
      - action
      - entity
      - entity_id
      - details
      - ip
      title: AuditOut
    BulkCategory:
      properties:
        ids:
          items:
            type: integer
          type: array
          maxItems: 500
          minItems: 1
          title: Ids
          description: ID регулярных платежей
          examples:
          - - 1
            - 2
            - 3
        category_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Category Id
          description: Категория; null — убрать из категории
      additionalProperties: false
      type: object
      required:
      - ids
      - category_id
      title: BulkCategory
    BulkIds:
      properties:
        ids:
          items:
            type: integer
          type: array
          maxItems: 500
          minItems: 1
          title: Ids
          description: ID регулярных платежей
          examples:
          - - 1
            - 2
            - 3
      additionalProperties: false
      type: object
      required:
      - ids
      title: BulkIds
    BulkResultOut:
      properties:
        changed:
          items:
            type: integer
          type: array
          title: Changed
          description: Платежи, которые изменились этим запросом
        unchanged:
          items:
            type: integer
          type: array
          title: Unchanged
          description: Уже были в нужном состоянии — ничего не изменилось
      type: object
      required:
      - changed
      - unchanged
      title: BulkResultOut
    CategoryIn:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[^\x00-\x1F\x7F]*$
          title: Name
          examples:
          - Серверы
      additionalProperties: false
      type: object
      required:
      - name
      title: CategoryIn
    CategoryOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        payments_count:
          type: integer
          title: Payments Count
          description: Сколько активных платежей в категории
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - payments_count
      - created_at
      title: CategoryOut
    Currency:
      type: string
      enum:
      - RUB
      - USD
      - EUR
      title: Currency
    CurrencySummaryOut:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        paid:
          $ref: '#/components/schemas/TotalOut'
          description: Фактически оплачено (по дате оплаты)
        unpaid:
          $ref: '#/components/schemas/TotalOut'
          description: Не оплачено (по сроку)
        overdue:
          $ref: '#/components/schemas/TotalOut'
          description: Не оплачено и срок прошёл
      type: object
      required:
      - currency
      - paid
      - unpaid
      - overdue
      title: CurrencySummaryOut
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          examples:
          - forbidden
        message:
          type: string
          title: Message
          examples:
          - Действие доступно только администратору
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
    ForecastItemOut:
      properties:
        recurring_payment_id:
          type: integer
          title: Recurring Payment Id
        name:
          type: string
          title: Name
        due_date:
          type: string
          format: date
          title: Due Date
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum:
          - paid
          - unpaid
          - planned
          title: Status
          description: planned — плановый срок по графику, период ещё не создан
        occurrence_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Occurrence Id
        state:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceState'
          - type: 'null'
        paid_at:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Paid At
      type: object
      required:
      - recurring_payment_id
      - name
      - due_date
      - amount
      - currency
      - status
      - occurrence_id
      - state
      - paid_at
      title: ForecastItemOut
    ForecastOut:
      properties:
        date_from:
          type: string
          format: date
          title: Date From
        date_to:
          type: string
          format: date
          title: Date To
        items:
          items:
            $ref: '#/components/schemas/ForecastItemOut'
          type: array
          title: Items
        totals:
          items:
            $ref: '#/components/schemas/ForecastTotalOut'
          type: array
          title: Totals
      type: object
      required:
      - date_from
      - date_to
      - items
      - totals
      title: ForecastOut
    ForecastTotalOut:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        planned:
          $ref: '#/components/schemas/TotalOut'
          description: Плановые расходы за период (бюджет)
        paid:
          $ref: '#/components/schemas/TotalOut'
          description: Из них оплачено
        remaining:
          $ref: '#/components/schemas/TotalOut'
          description: Осталось оплатить
      type: object
      required:
      - currency
      - planned
      - paid
      - remaining
      title: ForecastTotalOut
    Frequency:
      type: string
      enum:
      - weekly
      - monthly
      - quarterly
      - yearly
      title: Frequency
    LoginRequest:
      properties:
        login:
          type: string
          maxLength: 64
          minLength: 1
          title: Login
          examples:
          - admin
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
          examples:
          - change-me
      additionalProperties: false
      type: object
      required:
      - login
      - password
      title: LoginRequest
    LoginResponse:
      properties:
        token:
          type: string
          title: Token
          description: 'Передавайте в заголовке Authorization: Bearer <token>'
        token_type:
          type: string
          const: bearer
          title: Token Type
          default: bearer
        expires_at:
          type: string
          format: date-time
          title: Expires At
        user:
          $ref: '#/components/schemas/UserOut'
      type: object
      required:
      - token
      - expires_at
      - user
      title: LoginResponse
    MetaOut:
      properties:
        today:
          type: string
          format: date
          title: Today
          description: Сегодняшняя дата в часовом поясе приложения
        timezone:
          type: string
          title: Timezone
        reminder_days_before:
          type: integer
          title: Reminder Days Before
          description: Общее окно напоминания (см. GET /settings)
        uploads_enabled:
          type: boolean
          title: Uploads Enabled
          description: Можно ли прикреплять файлы чеков
        upload_max_mb:
          type: integer
          title: Upload Max Mb
        currencies:
          items:
            $ref: '#/components/schemas/Currency'
          type: array
          title: Currencies
        frequencies:
          items:
            $ref: '#/components/schemas/Frequency'
          type: array
          title: Frequencies
        telegram:
          $ref: '#/components/schemas/TelegramStatus'
      type: object
      required:
      - today
      - timezone
      - reminder_days_before
      - uploads_enabled
      - upload_max_mb
      - currencies
      - frequencies
      - telegram
      title: MetaOut
    OccurrenceBrief:
      properties:
        id:
          type: integer
          title: Id
        due_date:
          type: string
          format: date
          title: Due Date
        state:
          $ref: '#/components/schemas/OccurrenceState'
        is_overdue:
          type: boolean
          title: Is Overdue
        overdue_days:
          type: integer
          title: Overdue Days
        days_until_due:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days Until Due
        reminder_sent_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reminder Sent At
      type: object
      required:
      - id
      - due_date
      - state
      - is_overdue
      - overdue_days
      - days_until_due
      - reminder_sent_at
      title: OccurrenceBrief
    OccurrenceOut:
      properties:
        id:
          type: integer
          title: Id
        recurring_payment_id:
          type: integer
          title: Recurring Payment Id
        name:
          type: string
          title: Name
        frequency:
          $ref: '#/components/schemas/Frequency'
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
          examples:
          - '85000.00'
        currency:
          $ref: '#/components/schemas/Currency'
        due_date:
          type: string
          format: date
          title: Due Date
          description: Срок оплаты периода
        status:
          type: string
          enum:
          - paid
          - unpaid
          title: Status
        paid_at:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Paid At
          description: Фактическая дата оплаты
        paid_by:
          anyOf:
          - $ref: '#/components/schemas/PayerOut'
          - type: 'null'
        paid_via:
          anyOf:
          - type: string
            enum:
            - web
            - telegram
          - type: 'null'
          title: Paid Via
        is_overdue:
          type: boolean
          title: Is Overdue
          description: Не оплачено после срока или оплачено позже срока
        overdue_days:
          type: integer
          title: Overdue Days
        days_until_due:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days Until Due
        state:
          $ref: '#/components/schemas/OccurrenceState'
        reminder_sent_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reminder Sent At
        receipt_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Receipt Url
        receipt_file:
          anyOf:
          - $ref: '#/components/schemas/ReceiptFileOut'
          - type: 'null'
          description: Прикреплённый файл чека
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        category_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Category Id
        category_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Category Name
        payment_active:
          type: boolean
          title: Payment Active
          description: false — регулярный платёж прекращён (период остаётся в истории)
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - recurring_payment_id
      - name
      - frequency
      - amount
      - currency
      - due_date
      - status
      - paid_at
      - paid_by
      - paid_via
      - is_overdue
      - overdue_days
      - days_until_due
      - state
      - reminder_sent_at
      - receipt_url
      - receipt_file
      - comment
      - category_id
      - category_name
      - payment_active
      - created_at
      - updated_at
      title: OccurrenceOut
    OccurrenceState:
      type: string
      enum:
      - upcoming
      - due_soon
      - due_today
      - overdue
      - paid_on_time
      - paid_late
      title: OccurrenceState
    OccurrenceUpdate:
      properties:
        paid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Paid
        paid_at:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Paid At
          description: Фактическая дата оплаты, не позже сегодняшнего дня
        receipt_url:
          anyOf:
          - type: string
            maxLength: 2048
            minLength: 1
            format: uri
          - type: 'null'
          title: Receipt Url
          description: Ссылка на чек или платёжку (только http/https)
        comment:
          anyOf:
          - type: string
            maxLength: 1000
            pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
            examples:
            - Оплачено с карты офиса
          - type: 'null'
          title: Comment
          description: Комментарий к оплате; пустая строка или null — убрать
      additionalProperties: false
      type: object
      title: OccurrenceUpdate
      description: 'Отметить оплату, отменить отметку или исправить фактическую дату.


        - `{"paid": true}` — оплачено сегодня; `{"paid": true, "paid_at": "2026-10-20"}`
        — с указанной датой;

        - `{"paid": false}` — отменить оплату (фактическая дата очищается);

        - `{"paid_at": "2026-10-20"}` — исправить фактическую дату (срок не меняется).'
    Page_AuditOut_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: Page[AuditOut]
    Page_OccurrenceOut_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/OccurrenceOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: Page[OccurrenceOut]
    PayerOut:
      properties:
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: Логин пользователя или tg:@username, если отмечено в Telegram
      type: object
      required:
      - user_id
      - label
      title: PayerOut
    ReceiptFileOut:
      properties:
        filename:
          type: string
          title: Filename
        content_type:
          type: string
          enum:
          - application/pdf
          - image/png
          - image/jpeg
          - image/webp
          title: Content Type
        size:
          type: integer
          title: Size
          description: Размер в байтах
        sha256:
          type: string
          title: Sha256
          description: Отпечаток содержимого — по нему журнал понимает, тот ли это
            файл
        uploaded_at:
          type: string
          format: date-time
          title: Uploaded At
        uploaded_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Uploaded By
        url:
          type: string
          title: Url
          description: 'Открыть файл: GET с той же авторизацией'
      type: object
      required:
      - filename
      - content_type
      - size
      - sha256
      - uploaded_at
      - uploaded_by
      - url
      title: ReceiptFileOut
    RecurringPaymentCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          pattern: ^[^\x00-\x1F\x7F]*$
          title: Name
          examples:
          - Аренда офиса
        amount:
          anyOf:
          - type: number
            maximum: 1000000000000.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,2}0*$
          title: Amount
          description: Сумма, больше нуля, не более двух знаков после запятой
          examples:
          - '85000.00'
        currency:
          $ref: '#/components/schemas/Currency'
        next_due_date:
          type: string
          format: date
          title: Next Due Date
          description: Дата ближайшей оплаты — от неё строится график
        frequency:
          $ref: '#/components/schemas/Frequency'
          default: monthly
        remind_days:
          anyOf:
          - type: integer
            maximum: 365.0
            minimum: 3.0
            description: За сколько дней до срока напоминать (от 3 до 365)
            examples:
            - 3
          - type: 'null'
          title: Remind Days
          description: Своё окно напоминания в днях; не задано — общая настройка (GET
            /settings)
        category_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Category Id
          description: Категория (GET /categories); не задано — без категории
      additionalProperties: false
      type: object
      required:
      - name
      - amount
      - currency
      - next_due_date
      title: RecurringPaymentCreate
    RecurringPaymentOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
          examples:
          - '85000.00'
        currency:
          $ref: '#/components/schemas/Currency'
        frequency:
          $ref: '#/components/schemas/Frequency'
        anchor_date:
          type: string
          format: date
          title: Anchor Date
          description: Исходная дата графика
        next_due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Next Due Date
          description: Ближайший неоплаченный срок начиная с сегодня
        next_occurrence:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceBrief'
          - type: 'null'
          description: Самый ранний неоплаченный период (может быть просрочен)
        overdue_count:
          type: integer
          title: Overdue Count
        remind_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Remind Days
          description: Своё окно напоминания в днях; null — действует общая настройка
        remind_days_effective:
          type: integer
          title: Remind Days Effective
          description: За сколько дней до срока придёт напоминание по этому платежу
        category_id:
          anyOf:
