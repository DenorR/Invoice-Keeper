            - unpaid
            type: string
          - type: 'null'
          description: paid / unpaid
          title: Status
        description: paid / unpaid
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: true — только с просрочкой
          title: Overdue
        description: true — только с просрочкой
      - name: currency
