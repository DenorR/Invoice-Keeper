      type: object
      required:
      - today
      - timezone
      - reminder_days_before
      - currencies
      - frequencies
      - telegram
      title: MetaOut
    OccurrenceBrief:
      properties:
        id:
          type: integer
          title: Id
        due_date:
          type: string
          format: date
          title: Due Date
        state:
          $ref: '#/components/schemas/OccurrenceState'
        is_overdue:
          type: boolean
          title: Is Overdue
        overdue_days:
          type: integer
          title: Overdue Days
        days_until_due:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days Until Due
        reminder_sent_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reminder Sent At
      type: object
      required:
      - id
      - due_date
      - state
      - is_overdue
      - overdue_days
      - days_until_due
      - reminder_sent_at
      title: OccurrenceBrief
    OccurrenceOut:
      properties:
        id:
          type: integer
          title: Id
        recurring_payment_id:
          type: integer
          title: Recurring Payment Id
        name:
          type: string
          title: Name
        frequency:
          $ref: '#/components/schemas/Frequency'
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
          examples:
          - '85000.00'
        currency:
          $ref: '#/components/schemas/Currency'
        due_date:
          type: string
          format: date
          title: Due Date
          description: Срок оплаты периода
        status:
          type: string
          enum:
          - paid
          - unpaid
          title: Status
        paid_at:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Paid At
          description: Фактическая дата оплаты
        paid_by:
          anyOf:
          - $ref: '#/components/schemas/PayerOut'
          - type: 'null'
        paid_via:
          anyOf:
          - type: string
            enum:
            - web
            - telegram
          - type: 'null'
          title: Paid Via
        is_overdue:
          type: boolean
          title: Is Overdue
          description: Не оплачено после срока или оплачено позже срока
        overdue_days:
          type: integer
          title: Overdue Days
        days_until_due:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days Until Due
        state:
          $ref: '#/components/schemas/OccurrenceState'
        reminder_sent_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reminder Sent At
        receipt_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Receipt Url
        payment_active:
          type: boolean
          title: Payment Active
          description: false — регулярный платёж прекращён (период остаётся в истории)
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - recurring_payment_id
      - name
      - frequency
      - amount
      - currency
      - due_date
      - status
      - paid_at
      - paid_by
      - paid_via
      - is_overdue
      - overdue_days
      - days_until_due
      - state
      - reminder_sent_at
      - receipt_url
      - payment_active
      - created_at
      - updated_at
      title: OccurrenceOut
    OccurrenceState:
      type: string
      enum:
      - upcoming
      - due_soon
      - due_today
      - overdue
      - paid_on_time
      - paid_late
      title: OccurrenceState
    OccurrenceUpdate:
      properties:
        paid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Paid
        paid_at:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Paid At
          description: Фактическая дата оплаты, не позже сегодняшнего дня
        receipt_url:
          anyOf:
          - type: string
            maxLength: 2048
            minLength: 1
            format: uri
          - type: 'null'
          title: Receipt Url
          description: Ссылка на чек или платёжку (только http/https)
      additionalProperties: false
      type: object
      title: OccurrenceUpdate
      description: 'Отметить оплату, отменить отметку или исправить фактическую дату.


        - `{"paid": true}` — оплачено сегодня; `{"paid": true, "paid_at": "2026-10-20"}`
        — с указанной датой;

        - `{"paid": false}` — отменить оплату (фактическая дата очищается);

        - `{"paid_at": "2026-10-20"}` — исправить фактическую дату (срок не меняется).'
    Page_AuditOut_:
