openapi: 3.1.0
info:
  title: Invoice Keeper API
  description: "**Invoice Keeper** — учёт регулярных платежей с напоминаниями в Telegram.\n\
    \n* Все эндпоинты, кроме `POST /auth/login`, требуют авторизации: заголовок\n\
    \  `Authorization: Bearer <token>` (токен из ответа `login`) или cookie `ik_session`.\n\
    * Пользователь видит платежи и отмечает оплату; администратор дополнительно\n\
    \  управляет регулярными платежами и пользователями. Ограничения действуют в API.\n\
    * Даты — в формате `YYYY-MM-DD` в часовом поясе приложения. Суммы — строки с двумя\n\
    \  знаками после запятой, итоги — отдельно по каждой валюте (RUB, USD, EUR)."
  version: 1.6.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Авторизация
      summary: Вход по логину и паролю
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неверный логин или пароль
        '429':
          description: Слишком много попыток
