components:
  schemas:
    AuditOut:
      properties:
        id:
          type: integer
          title: Id
        at:
          type: string
          format: date-time
          title: At
        actor_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actor User Id
        actor_label:
          type: string
          title: Actor Label
        action:
          type: string
          title: Action
        entity:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity
        entity_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Entity Id
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
      type: object
      required:
      - id
      - at
      - actor_user_id
      - actor_label
      - action
      - entity
      - entity_id
      - details
      - ip
      title: AuditOut
    Currency:
      type: string
      enum:
      - RUB
      - USD
      - EUR
      title: Currency
    CurrencySummaryOut:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        paid:
          $ref: '#/components/schemas/TotalOut'
          description: Фактически оплачено (по дате оплаты)
        unpaid:
          $ref: '#/components/schemas/TotalOut'
          description: Не оплачено (по сроку)
        overdue:
          $ref: '#/components/schemas/TotalOut'
          description: Не оплачено и срок прошёл
      type: object
      required:
      - currency
      - paid
      - unpaid
      - overdue
      title: CurrencySummaryOut
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          examples:
          - forbidden
        message:
          type: string
          title: Message
          examples:
          - Действие доступно только администратору
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
    ForecastItemOut:
      properties:
        recurring_payment_id:
          type: integer
          title: Recurring Payment Id
        name:
          type: string
          title: Name
        due_date:
          type: string
          format: date
          title: Due Date
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum:
          - paid
          - unpaid
          - planned
          title: Status
          description: planned — плановый срок по графику, период ещё не создан
        occurrence_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Occurrence Id
        state:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceState'
          - type: 'null'
        paid_at:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Paid At
      type: object
      required:
      - recurring_payment_id
      - name
      - due_date
      - amount
      - currency
      - status
      - occurrence_id
      - state
      - paid_at
      title: ForecastItemOut
    ForecastOut:
      properties:
        date_from:
          type: string
          format: date
          title: Date From
        date_to:
          type: string
          format: date
          title: Date To
        items:
          items:
            $ref: '#/components/schemas/ForecastItemOut'
          type: array
          title: Items
        totals:
          items:
            $ref: '#/components/schemas/ForecastTotalOut'
          type: array
          title: Totals
      type: object
      required:
      - date_from
      - date_to
      - items
      - totals
      title: ForecastOut
    ForecastTotalOut:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        planned:
          $ref: '#/components/schemas/TotalOut'
          description: Плановые расходы за период (бюджет)
        paid:
          $ref: '#/components/schemas/TotalOut'
          description: Из них оплачено
        remaining:
          $ref: '#/components/schemas/TotalOut'
          description: Осталось оплатить
      type: object
      required:
      - currency
      - planned
      - paid
      - remaining
      title: ForecastTotalOut
    Frequency:
      type: string
      enum:
      - weekly
      - monthly
      - quarterly
      - yearly
      title: Frequency
    LoginRequest:
      properties:
        login:
          type: string
          maxLength: 64
          minLength: 1
