          const: bearer
          title: Token Type
          default: bearer
        expires_at:
          type: string
          format: date-time
          title: Expires At
        user:
          $ref: '#/components/schemas/UserOut'
      type: object
      required:
      - token
      - expires_at
      - user
      title: LoginResponse
    MetaOut:
